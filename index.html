 rect(0,edge+16,W,H-edge-16,'#0b121c');
 for(let y=edge+18;y<H;y+=13){
  const row=Math.floor((y-edge)/13);
  for(let x=(row%2? -8:0);x<W;x+=24){
   const tone=((Math.floor((x+(row%2?8:0))/24)+row)%3);

   rect(x+2,y+2,17,1,'#263745');

 // Always-visible ability silhouettes and impact warnings (rendered independently of damage cooldowns).
 const lv=(id)=>g.skills[id]||0;
 if(lv('orbit')){const n=Math.min(8,2+lv('orbit')),rr=(34+lv('orbit')*4)*(1+(g.areaLv||0)*.12);for(let k=0;k<n;k++){const a=g.skillAngle+k*Math.PI*2/n,ox=g.x+Math.cos(a)*rr,oy=g.y+Math.sin(a)*rr;ctx.globalAlpha=.28;ctx.strokeStyle='#74f3ff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(g.x,g.y,rr,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;rect(ox-4,oy-4,8,8,'#2b9fb7');rect(ox-2,oy-6,4,12,'#9af7ff');rect(ox-6,oy-2,12,4,'#9af7ff')}}
 if(lv('frost')){ctx.globalAlpha=.16;ctx.fillStyle='#8deaff';ctx.beginPath();ctx.arc(g.x,g.y,(78+lv('frost')*10)*(1+(g.areaLv||0)*.12),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 if(lv('sanctuary')){ctx.globalAlpha=.42;ctx.strokeStyle='#7cf7c8';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(g.x,g.y,(56+lv('sanctuary')*8)*(1+(g.areaLv||0)*.12),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
 if(lv('gravity')){ctx.globalAlpha=.34;ctx.strokeStyle='#c6a0ff';ctx.lineWidth=2.3;ctx.beginPath();ctx.arc(g.x,g.y,36+Math.sin(g.skillAngle*2)*5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(g.x,g.y,62+Math.cos(g.skillAngle*2)*5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
 if(lv('ward')){ctx.globalAlpha=.25;ctx.strokeStyle='#e6c8ff';ctx.lineWidth=2.3;ctx.beginPath();ctx.arc(g.x,g.y,22+lv('ward')*3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
 if(lv('comet'))for(const tr of g.trail||[]){ctx.globalAlpha=Math.max(0,tr.life/tr.max)*.6;rect(tr.x-tr.r/2,tr.y-tr.r/2,tr.r,tr.r,'#ff9c57')}ctx.globalAlpha=1;
 if(g.beamTarget&&g.beamTarget.life>0){ctx.globalAlpha=Math.min(1,g.beamTarget.life/.22);ctx.strokeStyle='#ff9dff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.lineTo(g.beamTarget.x,g.beamTarget.y);ctx.stroke();ctx.globalAlpha=1}
 g.enemies.forEach(e=>{if(e.type==='boss')drawBossSprite(e);else drawSprite(e.x,e.y,e,e.flash>0?'#fff1c7':e.color);if(e.hp<e.maxHp||e.type==='boss'){let bw=e.type==='boss'?34:Math.max(14,e.r*2),by=e.y-e.r-8;rect(e.x-bw/2,by,bw,3,'#3b1e32');rect(e.x-bw/2,by,bw*clamp(e.hp/e.maxHp,0,1),3,e.type==='boss'?'#d7a0ff':'#ff647c')}});
 drawBossMechanics(g.enemies.find(e=>e.type==='boss'));
 drawDetailedSkillEffects();
 g.fx.forEach(f=>{
  const duration=Math.max(.001,Number.isFinite(f.duration)?f.duration:.3);
  const remaining=clamp(f.life/duration,0,1);
  const radius=Math.max(1,f.max*(1-remaining)+8);
  if(f.kind==='impact'){
   // A compact, layered hit flash: bright core, broken shock arc, and short directional sparks.
   // The particle budget remains unchanged, so this adds detail without flooding the screen.
   const progress=1-remaining,seed=Number.isFinite(f.seed)?f.seed:0;
   ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=remaining*.92;
   ctx.strokeStyle=f.color;ctx.fillStyle='#fff7d9';ctx.shadowColor=f.color;ctx.shadowBlur=5+remaining*5;
   ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(f.x,f.y,Math.max(2,radius*.56),seed+progress*.9,seed+progress*.9+Math.PI*(1.1+remaining*.7));ctx.stroke();
   ctx.lineWidth=1.2+remaining*.8;
   for(let k=0;k<6;k++){const a=seed+k*Math.PI/3+progress*.55,inner=radius*(.45+((k%2)*.08)),outer=radius*(.82+((k%3)*.11));ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*inner,f.y+Math.sin(a)*inner);ctx.lineTo(f.x+Math.cos(a)*outer,f.y+Math.sin(a)*outer);ctx.stroke();}
   ctx.fillStyle='#fff7d9';ctx.fillRect(f.x-1.5,f.y-1.5,3,3);ctx.restore();
  }else{
   ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle=f.color;ctx.lineWidth=2.2;ctx.globalAlpha=remaining*.9;ctx.shadowColor=f.color;ctx.shadowBlur=4;
   ctx.beginPath();ctx.arc(f.x,f.y,radius,0,Math.PI*2);ctx.stroke();
   ctx.globalAlpha=remaining*.43;ctx.lineWidth=1;ctx.beginPath();ctx.arc(f.x,f.y,Math.max(1,radius*.72),0,Math.PI*2);ctx.stroke();ctx.restore();
  }
 });
 particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);rect(p.x,p.y,p.size,p.size,p.color)});ctx.globalAlpha=1;
 const activeChar=characterDefs.find(k=>k.id===g.skin)||characterDefs[0];if(g.invuln<=0||Math.floor(g.invuln*18)%2===0)drawSprite(g.x,g.y,'player',activeChar.color,g.walking?Math.floor(g.walkTime*2.1)%4:0);ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle=activeChar.accent;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(g.x,g.y,13+(g.t%1)*3,0,Math.PI*2);ctx.stroke();ctx.restore();
 const boss=g.enemies.find(e=>e.type==='boss');if(boss){rect(65,76,230,7,'#24152f');rect(65,76,230*clamp(boss.hp/boss.maxHp,0,1),7,'#bd76ff');ctx.save();ctx.shadowBlur=10;ctx.shadowColor='#d7a0ff';ctx.fillStyle='#fff1c7';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(`✦ WAVE ${g.wave} ELITE · FORM ${((g.wave-1)%10)+1}/10 ✦`,180,73);ctx.restore();ctx.textAlign='left';if(g.bossPatternNotice){const n=g.bossPatternNotice;ctx.save();ctx.globalAlpha=clamp(n.life/Math.min(.3,n.max),0,1);ctx.textAlign='center';ctx.font='bold 10px monospace';ctx.fillStyle=n.color;ctx.shadowBlur=8;ctx.shadowColor=n.color;ctx.fillText(`⚠ ${n.text}`,180,96);ctx.restore();}
  // Visible danger aura and rotating elite sigil.
  ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.22+.12*Math.sin(g.t*8);ctx.strokeStyle='#c879ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(boss.x,boss.y,27+Math.sin(g.t*5)*3,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(boss.x,boss.y,34, g.t*1.4,g.t*1.4+Math.PI*1.3);ctx.stroke();ctx.restore();
 }
 if(g.bossFlash>0){const q=g.bossFlash/.8;ctx.save();ctx.globalAlpha=q*.22;ctx.fillStyle='#d8a0ff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=q;ctx.strokeStyle='#e7c3ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H/2,Math.max(8,(1-q)*Math.max(W,H)*.7),0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff4ff';ctx.textAlign='center';ctx.font='bold 15px monospace';ctx.shadowBlur=12;ctx.shadowColor='#bd76ff';ctx.fillText('ELITE APPROACHING',W/2,Math.max(104,H*.23));ctx.restore()}
 if(g.specialFx){const q=g.specialFx.life/.55;const sk=(actionDefs.find(a=>a.id===g.specialFx.id)||actionDefs[0]);ctx.save();ctx.globalAlpha=q*.8;ctx.strokeStyle=sk.color;ctx.lineWidth=3;ctx.shadowBlur=14;ctx.shadowColor=sk.color;ctx.beginPath();ctx.arc(g.x,g.y,16+(1-q)*100,0,Math.PI*2);ctx.stroke();ctx.restore();}
 if(g.skillUpgradeFx>0){const q=g.skillUpgradeFx/1.25;ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=q;ctx.strokeStyle='#7ff8ff';ctx.lineWidth=2.5;ctx.shadowBlur=16;ctx.shadowColor='#52dfff';ctx.beginPath();ctx.arc(g.x,g.y,20+(1-q)*75,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#fff5be';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(g.x,g.y,15+(1-q)*55,0,Math.PI*2);ctx.stroke();ctx.textAlign='center';ctx.font='bold 10px monospace';ctx.fillStyle='#e8ffff';ctx.shadowBlur=12;ctx.fillText('✦ RANK UP ✦',g.x,g.y-46-(1-q)*8);ctx.fillText(g.skillUpgradeName||'',g.x,g.y-34-(1-q)*8);ctx.restore()}
 let grd=ctx.createRadialGradient(W/2,H/2,90,W/2,H/2,390);
 grd.addColorStop(0,'#0000');grd.addColorStop(1,'#070c18a8');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.restore();
}
function recoverFromFrameError(err){
 console.error('Game frame failed:',err);try{playSfx('error',true)}catch(_){}
 if(!g||state==='error')return;
 loopToken++;
 let note='ゲーム処理でエラーが発生したため一時停止しました。';if(err&&err.message)note+='\n原因: '+String(err.message).slice(0,180);note+='\n処理区分: '+String(updateStage||'不明');if(err&&err.stack){const loc=String(err.stack).split('\n').slice(1,3).join(' | ');if(loc)note+='\n発生箇所: '+loc.slice(0,180);}if(g&&g.waveRewardOpen){g.waveRewardOpen=false;g.waveRewardPending=true;}
 // Do not blame or delete the most recently selected skill without proof; preserve the run state.
 state='error';joy={x:0,y:0};pressedKeys.clear();
 panel(`<h2>一時停止</h2><p>${note.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}<br>問題が起きたWave報酬は、再開時にもう一度表示します。</p><button class="primary" id="recoverGame">ゲームを再開</button><button class="secondary" id="quitAfterError">タイトルへ</button>`);
 $('recoverGame').onclick=()=>{closePanel();state='playing';last=performance.now();updateHud();const token=++loopToken;requestAnimationFrame(now=>loop(now,token));};
 $('quitAfterError').onclick=showTitle;
}
function loop(now,token=loopToken){
 if(state!=='playing'||token!==loopToken)return;
 let dt=clamp((now-last)/1000||0,0,.04);last=now;
 try{update(dt);if(state==='playing'&&token===loopToken){render();requestAnimationFrame(t=>loop(t,token));}}
 catch(err){recoverFromFrameError(err);}
}
function setStick(e){let r=$('stick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}joy={x:dx/max,y:dy/max};$('nub').style.transform=`translate(${dx}px,${dy}px)`}
const stick=$('stick'),gameEl=$('game');
function beginFloatingStick(e){
 if(state!=='playing'||joyPointer!==null||e.button!==0)return;
 const bounds=gameEl.getBoundingClientRect(),px=e.clientX-bounds.left,py=e.clientY-bounds.top;
 // The whole left 62% is a movement field, including the visible brick/wall boundary at the bottom.
 // Only reserve the top HUD strip; the right side (dash/action cluster) remains available for buttons.
 if(px>bounds.width*.62||py<bounds.height*.14)return;
 e.preventDefault();pressedKeys.clear();joyPointer=e.pointerId;stick.style.display='block';
 const sw=stick.offsetWidth||116,sh=stick.offsetHeight||116;
 stick.style.left=clamp(px-sw/2,0,Math.max(0,gameEl.clientWidth-sw))+'px';
 stick.style.top=clamp(py-sh/2,0,Math.max(0,gameEl.clientHeight-sh))+'px';
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 setStick(e);
}
function resetStick(e){if(e&&joyPointer!==null&&e.pointerId!==joyPointer)return;if(joyPointer===null)return;joyPointer=null;stick.style.display='none';$('nub').style.transform='translate(0,0)';joy={x:0,y:0};refreshKeyboardMove()}
canvas.addEventListener('pointerdown',beginFloatingStick);canvas.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setStick(e)});canvas.addEventListener('pointerup',resetStick);canvas.addEventListener('pointercancel',resetStick);canvas.addEventListener('lostpointercapture',resetStick);
$('specialBtn').addEventListener('pointerdown',e=>{e.preventDefault();useSpecialAction()});$('menuBtn').onclick=pauseGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame()});
function refreshKeyboardMove(){if(joyPointer!==null)return;const has=(...keys)=>keys.some(k=>pressedKeys.has(k));joy={x:(has('ArrowRight','d','D')?1:0)-(has('ArrowLeft','a','A')?1:0),y:(has('ArrowDown','s','S')?1:0)-(has('ArrowUp','w','W')?1:0)};}
window.addEventListener('keydown',e=>{const moveKeys=['ArrowUp','w','W','ArrowDown','s','S','ArrowLeft','a','A','ArrowRight','d','D'];if(moveKeys.includes(e.key)){if(state==='playing'){pressedKeys.add(e.key);refreshKeyboardMove();e.preventDefault()}}if(e.key==='Shift'&&!e.repeat)useSpecialAction();if(e.key==='Escape'&&state==='playing')pauseGame()});
window.addEventListener('keyup',e=>{pressedKeys.delete(e.key);refreshKeyboardMove()});
window.addEventListener('blur',()=>{pressedKeys.clear();resetStick();if(joyPointer===null)joy={x:0,y:0}});
showTitle();
})();
</script>
